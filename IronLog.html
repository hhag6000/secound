  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { background: #0a0a0a; min-height: 100%; overscroll-behavior: none; }
    body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    #root { background: #0a0a0a; min-height: 100dvh; }
    input::placeholder { color: #555; }
    input:focus { outline: none; }
    select:focus { outline: none; }
    ::-webkit-scrollbar { display: none; }
    @keyframes slideUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes popIn { 0%{transform:scale(0.5);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
    .anim { animation: slideUp 0.2s ease; }
    button:active { opacity: 0.7; transform: scale(0.97); }
    /* ===== v15 visual refresh ===== */
    html { background: #08080a; }
    body {
      background: radial-gradient(900px 380px at 50% -150px, rgba(255,61,56,.15), transparent 72%), #08080a;
      background-repeat: no-repeat;
      font-family: Barlow, ILArabic, system-ui, sans-serif;
      color: #f4f4f6;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      overflow-anchor: none;
    }
    #root { background: transparent; }
    button, input, textarea, select { font-family: inherit; }
    input[type=number] { -moz-appearance: textfield; appearance: textfield; }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input:focus, textarea:focus { border-color: rgba(255,61,56,.65) !important; box-shadow: 0 0 0 3px rgba(255,61,56,.13); }
    .il-stepbox:focus-within { border-color: rgba(255,61,56,.65) !important; box-shadow: 0 0 0 3px rgba(255,61,56,.13); }
    .il-stepbox input:focus { box-shadow: none !important; }
    button { transition: transform .12s ease, opacity .12s ease, background-color .2s ease, border-color .2s ease; }
    ::selection { background: rgba(255,61,56,.35); }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(.78); } }

    .il-top {
      position: sticky; top: 0; z-index: 100; padding: 12px 16px 0;
      background: rgba(8,8,10,.82);
      -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .il-brand { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .il-word { display: flex; align-items: baseline; gap: 7px; font-family: Oswald, ILArabic, sans-serif; font-size: 24px; line-height: 1; letter-spacing: 1.5px; }
    .il-word b {
      font-weight: 700;
      background: linear-gradient(180deg, #ff756a 0%, #e5302a 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
    }
    .il-word i { font-style: normal; font-weight: 300; letter-spacing: 4px; color: #f2f2f4; }
    .il-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
      font-family: Oswald, ILArabic, sans-serif; font-size: 11px; letter-spacing: 1.2px; color: #8d8d96; white-space: nowrap;
    }
    .il-pill-red { cursor: pointer; background: rgba(255,61,56,.14); border-color: rgba(255,61,56,.45); color: #ff625c; font-size: 13px; font-weight: 600; letter-spacing: .5px; }
    .il-pill-green { cursor: pointer; background: rgba(52,199,89,.12); border-color: rgba(52,199,89,.4); color: #34c759; }
    .il-pill-amber { cursor: pointer; background: rgba(255,159,10,.1); border-color: rgba(255,159,10,.45); color: #ff9f0a; letter-spacing: 0; font-family: Barlow, ILArabic, sans-serif; font-weight: 700; font-size: 12px; margin-left: 6px; }
    .il-dot { width: 7px; height: 7px; border-radius: 50%; background: #ff3d38; animation: pulse 1s ease-in-out infinite; }
    .il-tabs { display: flex; margin: 0 -16px; padding: 0 6px; }
    .il-tab {
      position: relative; flex: 1 1 0; min-width: 0; background: none; border: none; cursor: pointer; padding: 8px 2px 11px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-family: Oswald, ILArabic, sans-serif; font-size: 9.5px; font-weight: 500; letter-spacing: 1px;
      color: #6b6b74; white-space: nowrap; transition: color .2s;
    }
    .il-ico { font-size: 17px; line-height: 1; filter: grayscale(1) opacity(.55); transition: filter .2s; }
    .il-tab.on .il-ico { filter: none; }
    .il-tab.on { color: #fff; }
    .il-tab.on::after {
      content: ""; position: absolute; left: 22%; right: 22%; bottom: 0; height: 2px; border-radius: 2px;
      background: linear-gradient(90deg, #ff3d38, #ff7a5c); box-shadow: 0 0 12px rgba(255,61,56,.7);
    }

\u0627\u0644\u0625\u062D\u0633\u0627\u0633: \u0627\u0644\u062A\u0631\u0627\u064A \u0644\u0627\u0632\u0645 \u062A\u0643\u0648\u0646 "\u0645\u0648\u0644\u0639\u0629 \u0646\u0627\u0631" \u0641\u064A \u0622\u062E\u0631 \u0627\u0644\u0639\u062F\u0627\u062A.`}],Pull:[{name:"Lat Pulldown",muscle:"Lats",sets:"3\xD710",instructor:`\u0627\u0644\u062A\u062C\u0647\u064A\u0632: \u0627\u0636\u0628\u0637 \u0645\u0633\u0646\u062F \u0627\u0644\u0631\u0643\u0628\u0629. \u0627\u0645\u0633\u0643 \u0627\u0644\u062D\u062F\u064A\u062F\u0629 \u0627\u0644\u0637\u0648\u064A\u0644\u0629 \u0648\u0627\u0633\u0639\u0629 (\u0623\u0648\u0633\u0639 \u0645\u0646 \u0643\u062A\u0627\u0641\u0643).

1. \u0645\u064A\u0644 \u0628\u062C\u0633\u0645\u0643 \u0644\u0648\u0631\u0627 \u0645\u064A\u0644 \u062E\u0641\u064A\u0641 \u062C\u062F\u0627\u064B\u060C \u0648\u0627\u0631\u0641\u0639 \u0635\u062F\u0631\u0643 \u0644\u0641\u0648\u0642.
2. \u0627\u0644\u0633\u0631: \u0627\u0633\u062D\u0628 \u0628\u0640 "\u0643\u0648\u0639\u0643" \u0644\u062C\u0646\u0628\u0643\u060C \u0645\u0634 \u0628\u0625\u064A\u062F\u0643. \u062A\u062E\u064A\u0644 \u0625\u0646\u0643 \u0628\u062A\u0632\u0642 \u0643\u0648\u0639\u0643 \u0644\u062A\u062D\u062A \u062A\u062C\u0627\u0647 \u062C\u064A\u0648\u0628 \u0628\u0646\u0637\u0644\u0648\u0646\u0643.
3. \u0627\u0633\u062D\u0628 \u0627\u0644\u062D\u062F\u064A\u062F\u0629 \u0644\u062D\u062F \u0645\u0627 \u062A\u0644\u0645\u0633 "\u0623\u0639\u0644\u0649 \u0635\u062F\u0631\u0643".
4. \u0641\u064A \u0627\u0644\u0637\u0644\u0648\u0639: \u0633\u064A\u0628 \u0627\u0644\u0648\u0632\u0646 \u064A\u0634\u062F \u062F\u0631\u0627\u0639\u0627\u062A\u0643 \u0644\u0641\u0648\u0642 \u0628\u0627\u0644\u0631\u0627\u062D\u0629 \u0639\u0634\u0627\u0646 \u062A\u0639\u0645\u0644 \u0627\u0633\u062A\u0631\u062A\u0634.

\u0627\u0644\u0625\u062D\u0633\u0627\u0633: \u0639\u0636\u0644\u0629 \u0627\u0644\u0636\u0647\u0631 \u0645\u0646 \u0627\u0644\u062C\u0646\u0628 \u0628\u062A\u0634\u062F \u0648\u062A\u0643\u0628\u0631.`},{name:"T-Bar Row",muscle:"Mid Back",sets:"4\xD710",instructor:`\u0627\u0644\u062A\u062C\u0647\u064A\u0632: \u0648\u0642\u0641 \u0641\u0648\u0642 \u0627\u0644\u062C\u0647\u0627\u0632\u060C \u0627\u0646\u062D\u0646\u0649 \u0644\u0644\u0623\u0645\u0627\u0645 \u0645\u0639 \u062B\u0646\u064A \u0631\u0643\u0628\u062A\u064A\u0643 \u0642\u0644\u064A\u0644\u0627\u064B\u060C \u0648\u0638\u0647\u0631\u0643 \u0645\u0633\u062A\u0642\u064A\u0645.

1. \u0627\u0645\u0633\u0643 \u0627\u0644\u0645\u0642\u0627\u0628\u0636 \u0628\u0625\u064A\u062F\u064A\u0646\u060C \u0648\u0627\u0641\u0631\u062F \u062F\u0631\u0627\u0639\u064A\u0643 \u0644\u0644\u0622\u062E\u0631.
2. \u0627\u0633\u062D\u0628 \u0627\u0644\u0648\u0632\u0646 \u0644\u0641\u0648\u0642 \u0646\u062D\u0648 \u0628\u0637\u0646\u0643\u060C \u0648\u0641\u064A \u0622\u062E\u0631 \u0627\u0644\u0633\u062D\u0628\u0629 "\u0627\u0639\u0635\u0631 \u0644\u0648\u062D\u064A\u0646 \u0643\u062A\u0641\u0643 \u0639\u0644\u0649 \u0628\u0639\u0636" \u062C\u0627\u0645\u062F.
3. \u0627\u0646\u0632\u0644 \u0628\u0627\u0644\u0631\u0627\u062D\u0629 \u0648\u062D\u0633 \u0628\u0627\u0644\u0627\u0633\u062A\u0631\u062A\u0634 \u0641\u064A \u0638\u0647\u0631\u0643.

\u0627\u0644\u0625\u062D\u0633\u0627\u0633: \u0638\u0647\u0631\u0643 \u0627\u0644\u0645\u0646\u062A\u0635\u0641 (\u0627\u0644\u0645\u062C\u0627\u0646\u0635) \u0628\u064A\u0634\u062A\u063A\u0644 \u0628\u0642\u0648\u0629.`},{name:"Reverse Pec Deck",muscle:"Rear Delts",sets:"3\xD715",instructor:`\u0627\u0644\u062A\u062C\u0647\u064A\u0632: \u0627\u0642\u0639\u062F \u0648\u0634\u0643 \u0644\u0644\u0645\u0643\u0646\u0629\u060C \u0648\u0627\u0645\u0633\u0643 \u0627\u0644\u0645\u0642\u0627\u0628\u0636 \u0641\u064A \u0645\u0633\u062A\u0648\u0649 \u0643\u062A\u0641\u0643.

1. \u0627\u0641\u062A\u062D \u062F\u0631\u0627\u0639\u0627\u062A\u0643 \u0644\u0628\u0631\u0629 \u0628\u0627\u0644\u0631\u0627\u062D\u0629.
2. \u0627\u0644\u0633\u0631: \u0645\u0627\u062A\u0641\u0631\u062F\u0634 \u062F\u0631\u0627\u0639\u0643 \u0644\u0644\u0622\u062E\u0631 (\u0633\u064A\u0628 \u062B\u0646\u064A\u0629 \u0628\u0633\u064A\u0637\u0629 \u0641\u064A \u0643\u0648\u0639\u0643).
3. \u0627\u0641\u062A\u062D \u0644\u062D\u062F \u0645\u0627 \u062A\u062D\u0633 \u0628\u0640 "\u0639\u0635\u0631\u0629" \u0641\u064A \u0638\u0647\u0631\u0643 \u0645\u0646 \u0641\u0648\u0642.

\u0627\u0644\u0625\u062D\u0633\u0627\u0633: \u062D\u0631\u0642\u0627\u0646 \u0641\u064A \u0627\u0644\u062C\u0632\u0621 \u0627\u0644\u062E\u0644\u0641\u064A \u0645\u0646 \u0643\u062A\u0641\u0643. \u0647\u064A\u0634\u062F \u0627\u0644\u0623\u0643\u062A\u0627\u0641 \u0644\u0648\u0631\u0627 \u0648\u064A\u062E\u0644\u064A\u0643 \u062A\u0645\u0634\u064A \u0645\u0641\u0631\u0648\u062F.`},{name:"Preacher Curl",muscle:"Biceps",sets:"3\xD712",instructor:`\u0627\u0644\u062A\u062C\u0647\u064A\u0632: \u0633\u0627\u0646\u062F \u062F\u0631\u0627\u0639\u0643 \u0639\u0644\u0649 \u0627\u0644\u0645\u062E\u062F\u0629 \u0627\u0644\u0645\u0627\u064A\u0644\u0629\u060C \u0628\u062D\u064A\u062B \u064A\u0643\u0648\u0646 \u0625\u0628\u0637\u0643 \u0645\u0644\u0645\u0633 \u0627\u0644\u0645\u062E\u062F\u0629.

1. \u0627\u0631\u0641\u0639 \u0627\u0644\u0648\u0632\u0646 \u0628\u062A\u0631\u0643\u064A\u0632\u060C \u0627\u0639\u0635\u0631 \u0627\u0644\u0628\u0627\u064A\u0633\u0628\u0633 \u0641\u0648\u0642 \u062B\u0627\u0646\u064A\u0629.
2. \u0627\u0646\u0632\u0644 \u0628\u0627\u0644\u0631\u0627\u062D\u0629 \u062C\u062F\u0627\u064B (\u0625\u064A\u0627\u0643 \u062A\u0633\u064A\u0628 \u0627\u0644\u0648\u0632\u0646 \u064A\u0634\u062F\u0643 \u0628\u0633\u0631\u0639\u0629).

\u0627\u0644\u0625\u062D\u0633\u0627\u0633: \u0627\u0644\u0628\u0627\u064A\u0633\u0628\u0633 "\u0645\u0648\u0644\u0639\u0629".`}],Legs:[{name:"Leg Press",muscle:"Quads",sets:"3\xD710",instructor:`\u0627\u0644\u062A\u062C\u0647\u064A\u0632: \u0627\u0642\u0639\u062F\u060C \u0636\u0647\u0631\u0643 \u0648\u0645\u0624\u062E\u0631\u062A\u0643 "\u0645\u062D\u0634\u0648\u0631\u064A\u0646" \u0641\u064A \u0627\u0644\u0643\u0631\u0633\u064A. \u0631\u062C\u0644\u0643 \u0641\u0648\u0642 \u0627\u0644\u0628\u0644\u0627\u0637\u0629 \u0648\u0627\u0633\u0639\u0629 (\u0623\u0648\u0633\u0639 \u0645\u0646 \u0643\u062A\u0641\u0643)\u060C \u0645\u0634\u0637 \u0631\u062C\u0644\u0643 \u0628\u0627\u0635\u0635 \u0644\u0628\u0631\u0629 (\u0632\u0627\u0648\u064A\u0629 45).

1. \u0627\u0639\u0635\u0631 \u0628\u0637\u0646\u0643 \u062C\u0627\u0645\u062F \u0642\u0628\u0644 \u0645\u0627 \u062A\u0634\u064A\u0644 \u0627\u0644\u0648\u0632\u0646.
2. \u0627\u0641\u0631\u062F \u0631\u062C\u0644\u0643 (\u0645\u0646 \u063A\u064A\u0631 \u0645\u0627 \u062A\u0642\u0641\u0644 \u0627\u0644\u0631\u0643\u0628\u0629 \u0644\u0644\u0622\u062E\u0631).
3. \u0627\u0644\u0646\u0632\u0648\u0644: \u0627\u0646\u0632\u0644 \u0628\u0628\u0637\u0621 \u062C\u062F\u0627\u064B (\u0639\u062F 3). \u0631\u0643\u0628\u062A\u0643 \u062A\u0641\u062A\u062D \u0644\u0628\u0631\u0629 \u0648\u0647\u064A \u0646\u0627\u0632\u0644\u0629.
4. \u0627\u0644\u0632\u0642\u0629: \u0632\u0642 \u0628\u0640 \u0643\u0639\u0628 \u0631\u062C\u0644\u0643\u060C \u0645\u0634 \u0628\u0645\u0634\u0637 \u0631\u062C\u0644\u0643.

\u0627\u0644\u0625\u062D\u0633\u0627\u0633: \u0636\u063A\u0637 \u0641\u064A \u0639\u0636\u0644\u0627\u062A \u0627\u0644\u0636\u0627\u0645\u0629 (\u062C\u0648\u0647 \u0627\u0644\u0641\u062E\u062F) \u0648\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u062D\u0648\u0636.`},{name:"Leg Extension",muscle:"Quads",sets:"3\xD712",instructor:`\u0627\u0644\u062A\u062C\u0647\u064A\u0632: \u0627\u0644\u0643\u0631\u0633\u064A \u0645\u0638\u0628\u0648\u0637 \u0628\u062D\u064A\u062B "\u0648\u0634 \u0631\u0643\u0628\u062A\u0643" \u0639\u0646\u062F \u0645\u062D\u0648\u0631 \u062F\u0648\u0631\u0627\u0646 \u0627\u0644\u062C\u0647\u0627\u0632.

1. \u0627\u0645\u0633\u0643 \u0645\u0642\u0627\u0628\u0636 \u0627\u0644\u062C\u0647\u0627\u0632 \u0628\u0642\u0648\u0629 \u0644\u062A\u062B\u0628\u064A\u062A \u062C\u0633\u0645\u0643.
2. \u0627\u0631\u0641\u0639 \u0627\u0644\u0648\u0632\u0646 \u0628\u062A\u0631\u0643\u064A\u0632\u060C \u0648\u0644\u0645\u0627 \u0631\u062C\u0644\u0643 \u062A\u062A\u0641\u0631\u062F \u0627\u0639\u0635\u0631 \u0639\u0636\u0644\u0629 \u0627\u0644\u0641\u062E\u062F (\u0627\u0644\u062F\u0645\u0639\u0629) \u0644\u0645\u062F\u0629 \u062B\u0627\u0646\u064A\u0629 \u0643\u0627\u0645\u0644\u0629.
3. \u0627\u0646\u0632\u0644 \u0628\u0627\u0644\u0631\u0627\u062D\u0629 \u062C\u062F\u0627\u064B (3 \u062B\u0648\u0627\u0646\u064A).

\u0627\u0644\u0625\u062D\u0633\u0627\u0633: \u062D\u0631\u0642\u0627\u0646 \u0634\u062F\u064A\u062F \u0641\u0648\u0642 \u0627\u0644\u0631\u0643\u0628\u0629 \u0645\u0628\u0627\u0634\u0631\u0629. \u0644\u0648 \u062D\u0633\u064A\u062A \u0628\u0648\u062C\u0639 \u062F\u0627\u062E\u0644 \u0627\u0644\u0631\u0643\u0628\u0629\u060C \u0648\u0642\u0641 \u0648\u0642\u0644\u0644 \u0627\u0644\u0648\u0632\u0646.`},{name:"Seated Leg Curl",muscle:"Hamstrings",sets:"3\xD712",instructor:`\u0627\u0644\u062A\u062C\u0647\u064A\u0632: \u0627\u0631\u0641\u0639 "\u0627\u0644\u0645\u062E\u062F\u0629" \u0627\u0644\u0644\u064A \u0641\u0648\u0642 \u0631\u062C\u0644\u0643 \u0644\u062D\u062F \u0645\u0627 \u062A\u0636\u063A\u0637 \u0639\u0644\u0649 \u0641\u062E\u062F\u0643.

1. \u0627\u0633\u062D\u0628 \u0628\u0631\u062C\u0644\u0643 \u0644\u062A\u062D\u062A \u0644\u0648\u0631\u0627 (\u0643\u0623\u0646\u0643 \u0628\u062A\u062C\u064A\u0628 \u0643\u0639\u0628\u0643 \u0641\u064A \u0645\u0624\u062E\u0631\u062A\u0643).
2. \u0627\u0639\u0635\u0631 \u0627\u0644\u0639\u0636\u0644\u0629 \u0627\u0644\u0644\u064A \u0648\u0631\u0627 \u0627\u0644\u0641\u062E\u062F \u0648\u0623\u0646\u062A \u0636\u0627\u0645\u0645 \u0631\u062C\u0644\u0643.
3. \u0627\u0631\u062C\u0639 \u0628\u0627\u0644\u0631\u0627\u062D\u0629 \u062C\u062F\u0627\u064B.

\u0627\u0644\u0625\u062D\u0633\u0627\u0633: \u0634\u062F \u0641\u064A \u0627\u0644\u0639\u0636\u0644\u0629 \u0627\u0644\u0644\u064A \u0648\u0631\u0627 \u0627\u0644\u0641\u062E\u062F.`},{name:"Glute Bridge",muscle:"Glutes",sets:"3\xD715",instructor:`\u0627\u0644\u062A\u062C\u0647\u064A\u0632: \u0627\u062A\u0643\u064A\u0645 \u0639\u0644\u0649 \u0636\u0647\u0631\u0643\u060C \u0631\u0643\u0628\u062A\u0643 \u0645\u0646\u062D\u0646\u064A\u0629\u060C \u0631\u062C\u0644\u0643 \u0639\u0644\u0649 \u0627\u0644\u0623\u0631\u0636.

1. \u0627\u0631\u0641\u0639 \u0645\u0624\u062E\u0631\u062A\u0643 \u0644\u0641\u0648\u0642 \u0644\u062D\u062F \u0645\u0627 \u062C\u0633\u0645\u0643 \u064A\u0628\u0642\u0649 \u062E\u0637 \u0645\u0633\u062A\u0642\u064A\u0645 \u0645\u0646 \u0631\u0643\u0628\u062A\u0643 \u0644\u0643\u062A\u0641\u0643.
2. \u0627\u0639\u0635\u0631 \u0627\u0644\u0645\u0624\u062E\u0631\u0629 \u0628\u0642\u0648\u0629 \u0641\u064A \u0623\u0639\u0644\u0649 \u0646\u0642\u0637\u0629 \u0648\u0627\u062B\u0628\u062A \u062B\u0627\u0646\u064A\u0629.
3. \u0627\u0646\u0632\u0644 \u0628\u0627\u0644\u0631\u0627\u062D\u0629.

\u0627\u0644\u0625\u062D\u0633\u0627\u0633: \u062D\u0631\u0642\u0627\u0646 \u0641\u064A \u0627\u0644\u0645\u0624\u062E\u0631\u0629 \u0648\u0627\u0644\u0641\u062E\u062F \u0645\u0646 \u0648\u0631\u0627.`},{name:"Calf Raise",muscle:"Calves",sets:"3\xD715",instructor:`\u0627\u0644\u0645\u0631\u062D\u0644\u0629 \u0627\u0644\u0623\u0648\u0644\u0649 - \u0627\u0644\u0646\u0632\u0648\u0644:
\u2022 \u0627\u0646\u0632\u0644 \u0628\u0643\u0639\u0628\u0643 \u0644\u0623\u0633\u0641\u0644 \u0646\u0642\u0637\u0629 \u0645\u0645\u0643\u0646\u0629\u060C \u0644\u062D\u062F \u0645\u0627 \u062A\u062D\u0633 \u0628\u0640 "\u0627\u0633\u062A\u0631\u062A\u0634 \u062C\u0627\u0645\u062F" \u0641\u064A \u0627\u0644\u0633\u0645\u0627\u0646\u0629 \u0645\u0646 \u0648\u0631\u0627.
\u2022 \u0627\u0646\u0632\u0644 \u0628\u0628\u0637\u0621 \u0634\u062F\u064A\u062F \u2014 \u0639\u062F 3 \u062B\u0648\u0627\u0646\u064A. \u0627\u0644\u0627\u0633\u062A\u0631\u062A\u0634 \u062F\u0647 \u0647\u0648 \u0627\u0644\u0644\u064A \u0628\u064A\u0628\u0646\u064A \u0627\u0644\u0639\u0636\u0644!
